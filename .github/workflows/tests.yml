name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # 只装 dev 组，**不装 .[embedding]**（torch 约 200MB+，会显著拖慢 CI）。
      # 这是可行的，因为：
      #   1. bge.py 里 `from sentence_transformers import ...` 在函数内部（懒加载）；
      #   2. 287 个测试没有一个 import torch / sentence_transformers；
      #   3. 测试全部用 tmp_path 造临时语料，不依赖真实的 data/raw 与 data/index。
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q
