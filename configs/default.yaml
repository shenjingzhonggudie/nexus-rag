# RAGKit 默认配置
# 用法：load_config("configs/default.yaml")

# 检索参数
retrieval:
  top_k: 20            # 每路召回数量上限，以及融合后的重排候选池上限
  final_k: 5           # 最终返回给生成阶段的证据条数（必须 <= top_k）
  fusion_method: weighted_rrf # weighted_rrf（加权排名融合）或 rrf（等权RRF）
  fusion_alpha: 0.7    # 双路加权融合的BM25权重；不表示已证明的最优参数
  sparse_enabled: true # 是否启用 BM25 稀疏召回
  dense_enabled: true  # 是否启用向量稠密召回
  refuse_threshold: 0.05 # 拒答阈值：查询实词覆盖率低于它则拒答；0 = 不启用

# 独立的query-document CrossEncoder重排，默认启用并仅加载本地模型
rerank:
  enabled: true
  model_name: BAAI/bge-reranker-base # 可用已下载的本地路径
  batch_size: 16
  max_length: 512 # 问题与候选正文的总token上限；超过会截断
  device: cpu
  local_files_only: true # 仅使用本地文件；缺文件时明确失败，不回退为融合

# 分块参数
chunking:
  strategy: heading    # 分块策略：heading（按 ## 标题，块级标注用）| fixed
  chunk_size: 300      # 每块目标有效长度（汉字 1 字、英文字母 3 个算 1 字、空白不计）
  overlap: 50          # 相邻块重叠**字符数**（注意单位与 chunk_size 不同，必须 < chunk_size）

# 向量化参数
embedding:
  provider: hashing                   # hashing（字面级，零依赖）| bge（本地语义模型，需 sentence-transformers）
  dim: 512                            # 向量维度；切 bge 时必须与模型输出维度一致
  model_name: BAAI/bge-small-zh-v1.5  # bge 模型名或本地路径；hashing 忽略

# 大模型参数（默认关闭，离线可运行）
llm:
  provider: none       # none | openai_compatible
  model: ""            # 模型名，如 gpt-4o-mini
  api_key: ""          # 密钥建议放 .env，不要写进这里
  base_url: ""         # 兼容服务的地址

# 目录
data_dir: data/raw     # 原始语料目录（build 的语料来源）
index_dir: data/index  # 检索索引保存目录
