# RAGKit 默认配置
# 用法：load_config("configs/default.yaml")

# 检索参数
retrieval:
  top_k: 20            # 粗排召回候选数
  final_k: 5           # 最终返回给生成阶段的证据条数（必须 <= top_k）
  fusion_alpha: 0.9    # 加权排名融合里 BM25 腿权重（0~1，0.9=BM25 为主）
  sparse_enabled: true # 是否启用 BM25 稀疏召回
  dense_enabled: true  # 是否启用向量稠密召回
  rerank_enabled: false # 是否启用重排（默认关：dense 余弦精排负贡献，见消融结论）
  refuse_threshold: 0.05 # 拒答阈值：查询实词覆盖率低于它则拒答；0 = 不启用

# 分块参数
chunking:
  strategy: heading    # 分块策略：heading（按 ## 标题，块级标注用）| fixed
  chunk_size: 300      # 每块目标字符数
  overlap: 50          # 相邻块重叠字符数（必须 < chunk_size）

# 向量化参数
embedding:
  provider: hashing                   # hashing（字面级，零依赖）| bge（本地语义模型，需 sentence-transformers）
  dim: 512                            # 向量维度；切 bge 时必须与模型输出维度一致
  model_name: BAAI/bge-small-zh-v1.5  # bge 模型名或本地路径；hashing 忽略

# 大模型参数（默认关闭，离线可运行）
llm:
  provider: none       # none | openai_compatible
  model: ""            # 模型名，如 gpt-4o-mini
  api_key: ""          # 密钥建议放 .env，不要写进这里
  base_url: ""         # 兼容服务的地址

# 目录
data_dir: data/raw     # 原始语料目录（build 的语料来源）
index_dir: data/index  # 检索索引保存目录
