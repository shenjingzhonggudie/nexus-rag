# 构建配置：使用 setuptools 构建项目，要求其版本不低于 68
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# 项目元信息：声明包名、版本、简介，以及支持的最低 Python 版本
[project]
name = "ragkit"
version = "1.0.0"
description = "From-scratch Chinese RAG system: BM25 + dense hybrid retrieval, RRF fusion, rerank, offline-first"
readme = "README.md"
requires-python = ">=3.11"
# 运行时依赖：PyYAML 用于读写 YAML，Pydantic 用于数据校验。
dependencies = ["pyyaml", "pydantic", "jieba", "numpy"]

# 可选开发依赖：安装 dev 依赖组时引入 pytest，用于运行测试
[project.optional-dependencies]
dev = ["pytest>=8"]

# 告诉 setuptools：包不在根目录，而在 src/ 下面
[tool.setuptools.packages.find]
where = ["src"]

# 安装后生成命令行程序 ragkit，执行 ragkit.cli 里的 main 函数
[project.scripts]
ragkit = "ragkit.cli:main"

# pytest 配置：默认从 tests 目录中查找测试
[tool.pytest.ini_options]
testpaths = ["tests"]
