# 构建配置：使用 setuptools 构建项目，要求其版本不低于 68
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# 项目元信息：声明包名、版本、简介，以及支持的最低 Python 版本
[project]
name = "ragkit"
version = "1.0.0"
description = "From-scratch Chinese RAG system: BM25 + dense hybrid retrieval, RRF fusion, rerank, offline-first"
readme = "README.md"
requires-python = ">=3.11"
# 运行时依赖：PyYAML 用于读写 YAML，Pydantic 用于数据校验。
dependencies = ["pyyaml", "pydantic", "jieba", "numpy"]

# 可选依赖组：
# - dev：pytest（跑测试）
# - embedding：sentence-transformers（本地 BGE 语义模型，体积较大，默认不装）
[project.optional-dependencies]
dev = ["pytest>=8"]
embedding = ["sentence-transformers>=2.2"]

# 告诉 setuptools：包不在根目录，而在 src/ 下面
[tool.setuptools.packages.find]
where = ["src"]

# 静态资源随包安装：内置 Web UI 的 HTML 放在 ragkit/api/static/
# 不加这段的话，wheel 安装后 `ragkit serve` 找不到页面（editable 安装不受影响）
[tool.setuptools.package-data]
"ragkit.api" = ["static/*.html"]

# 安装后生成命令行程序 ragkit，执行 ragkit.cli 里的 main 函数
[project.scripts]
ragkit = "ragkit.cli:main"

# pytest 配置：默认从 tests 目录中查找测试
[tool.pytest.ini_options]
testpaths = ["tests"]
